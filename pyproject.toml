[project]
name = "plex-general-admission"
version = "0.4.0"
description = "Plex General Ad-mission: organize, preview, and schedule Plex pre-roll videos."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi==0.123.10",
  "httpx==0.28.1",
  "itsdangerous==2.2.0",
  "jinja2==3.1.6",
  "python-dateutil==2.9.0.post0",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.38.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
